# web/ 폴더를 GitHub Pages에 올린다.
# 배포 전에 테스트를 돌려 깨진 채로 나가지 않게 막는다.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 뒤엣것만 살린다. 진행 중인 것을 죽이지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 게이트. 의존성이 없어 설치 단계가 없다.
      - name: 테스트
        working-directory: web
        run: node --test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
