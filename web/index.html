<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말동무</title>
<style>
/* 색은 대비비를 계산해서 골랐다. 라이트 기준 확정 글자 17.8:1,
   중간 결과 7.0:1, 상태줄과 고지 7.4:1. 다크는 각각 17.0:1, 9.0:1, 8.5:1.
   중간 결과를 opacity로 흐리게 하지 않는다. 눈으로 읽는 것이 이 앱의 기능이다. */
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --surface: #f2f3f5;
  --border: #d7dae0;
  --text: #16181d;
  --interim: #1550c8;
  --muted: #4a4f57;
  --accent: #1550c8;
  --accent-text: #ffffff;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216;
    --surface: #1b1e24;
    --border: #333842;
    --text: #f2f4f7;
    --interim: #8ab4ff;
    --muted: #b3b9c4;
    --accent: #8ab4ff;
    --accent-text: #101216;
  }
}

* { box-sizing: border-box; }

html {
  /* 아이폰이 가로 모드에서 글자를 제멋대로 키우지 못하게 막는다.
     크기는 사용자가 버튼으로 정한다. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  /* dvh를 쓴다. 아이폰 사파리에서 100vh는 주소창이 숨은 상태의 높이라
     컨트롤 바가 화면 밖으로 밀려난다. */
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Malgun Gothic", system-ui, sans-serif;
}

/* 상태 줄. 페이지 전체에서 유일한 live region이다. */
#status {
  flex: none;
  margin: 0;
  padding: 12px 16px;
  /* 가로 모드 아이폰에서 노치에 글자가 가리지 않게 한다.
     env를 모르는 브라우저는 위 줄만 적용한다. */
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  font-size: 16px;
  line-height: 1.5;
  color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

/* 자막 영역. 화면의 대부분을 차지한다.
   min-height: 0이 없으면 flex 항목이 내용보다 작아지지 못해 스크롤이 죽는다. */
#captions {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px 16px 24px;
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  /* 기본 28px. app.js가 사용자가 고른 크기로 덮어쓴다. */
  font-size: 28px;
  line-height: 1.6;
  /* 한국어는 어절 단위로 끊어야 읽힌다. keep-all이 없으면 낱말 가운데가 잘린다. */
  word-break: keep-all;
  overflow-wrap: break-word;
}

#captions:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: -3px;
}

/* 읽기 폭을 30em으로 묶는다. em이라 글자를 키워도 한 줄의 글자 수가 그대로다.
   확정과 중간 결과가 같은 세로선에서 시작하도록 확정 쪽에도 같은 두께의
   투명 테두리를 준다. */
#finals,
#interim {
  max-width: 30em;
  margin: 0 auto;
  border-inline-start: 4px solid transparent;
  padding-inline-start: 12px;
}

#finals p {
  margin: 0 0 0.7em;
}

/* 중간 결과는 색과 왼쪽 막대 두 가지로 알린다.
   색만 쓰면 색각이상 사용자에게 신호가 하나도 남지 않는다. */
#interim {
  margin: 0;
  color: var(--interim);
  border-inline-start-color: var(--interim);
}

#interim:empty {
  display: none;
}

#controls {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 16px;
  /* 아이폰 홈 인디케이터와 노치에 버튼이 가리지 않게 한다. */
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

button {
  font-family: inherit;
  font-weight: 500;
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
}

/* 터치 타깃은 전부 44px을 넘긴다. 시작 버튼이 가장 크다. */
#toggle {
  min-height: 56px;
  font-size: 20px;
  border: none;
  background: var(--accent);
  color: var(--accent-text);
}

#subControls {
  display: flex;
  gap: 10px;
}

#subControls button {
  flex: 1;
  min-height: 48px;
  font-size: 16px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
}

button:disabled {
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--border);
  cursor: not-allowed;
}

/* 포커스 표시는 버튼 바깥에 그린다. 시작 버튼은 배경이 강조색이라
   테두리를 안쪽에 그리면 보이지 않는다. */
button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

#notice {
  margin: 0;
  font-size: 15px;
  line-height: 1.5;
  color: var(--muted);
}
</style>
</head>
<body>

<p id="status" role="status">시작을 누르면 자막이 나옵니다</p>

<main id="captions" tabindex="0" aria-label="자막">
  <!-- app.js가 확정 문단마다 이 안에 <p>를 하나씩 넣는다. -->
  <div id="finals"></div>
  <!-- 아직 확정되지 않은 문장. 비어 있으면 자리를 차지하지 않는다. -->
  <p id="interim"></p>
</main>

<div id="controls">
  <button type="button" id="toggle">시작</button>
  <div id="subControls">
    <button type="button" id="fontDown">글자 작게</button>
    <button type="button" id="fontUp">글자 크게</button>
    <button type="button" id="copy" hidden>전체 복사</button>
  </div>
  <p id="notice">음성은 브라우저의 인식 서비스로 전송되어 처리됩니다.</p>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
